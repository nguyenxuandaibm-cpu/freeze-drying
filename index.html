<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giám Sát Máy Sấy Lạnh</title>
  <!-- CẤU HÌNH BIẾN WEB THÀNH APP TRÊN IPHONE (iOS) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Máy Sấy Lạnh">
  
  <!-- Icon hiển thị ngoài màn hình chính iPhone (Tùy chọn) -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/thermometer.png">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
    .container { max-width: 400px; margin: auto; }
    .card { background: white; padding: 20px; margin: 15px 0; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .value { font-size: 2.8em; font-weight: bold; color: #1877f2; }
    .humidity { color: #42b72a; }
    .status { font-size: 0.9em; color: #65676b; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>HỆ THỐNG GIÁM SÁT MÁY SẤY LẠNH</h2>

    <div class="card">
      <h3>Nhiệt Độ Buồng Sấy</h3>
      <div id="temp" class="value">-- °C</div>
    </div>

    <div class="card">
      <h3>Độ Ẩm Buồng Sấy</h3>
      <div id="hum" class="value humidity">-- %</div>
    </div>

    <div id="status" class="status">Đang kết nối tới Firebase...</div>
  </div>

  <script>
    // Điền chính xác URL Firebase của bạn
    const firebaseConfig = {
      databaseURL: "https://freeze-drying-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Lắng nghe dữ liệu thời gian thực
    db.ref('/may_say').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('temp').innerText = data.nhiet_do.toFixed(1) + ' °C';
        document.getElementById('hum').innerText = data.do_am.toFixed(1) + ' %';
        document.getElementById('status').innerText = 'Trạng thái: Trực tuyến (Thời gian thực)';
      }
    }, (error) => {
      document.getElementById('status').innerText = 'Lỗi kết nối Firebase: ' + error.message;
    });
  </script>
</body>
</html>
