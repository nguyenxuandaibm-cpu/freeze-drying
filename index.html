<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Giám Sát Máy Sấy Lạnh</title>

  <!-- Cấu hình biến Web thành App trên iPhone/Android (PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Máy Sấy Lạnh">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/thermometer.png">

  <!-- Thư viện Firebase JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Thư viện Chart.js để vẽ biểu đồ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 15px; color: #333; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { margin: 0; color: #1a202c; font-size: 1.5rem; }
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-top: 8px; background-color: #e2e8f0; color: #4a5568; transition: all 0.3s ease; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 600px; margin: 0 auto 20px auto; }
    .card { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h3 { margin: 0 0 8px 0; font-size: 0.9rem; color: #718096; text-transform: uppercase; letter-spacing: 0.5px; }
    .value { font-size: 2rem; font-weight: 700; color: #e53e3e; }
    .value.hum { color: #38a169; }

    .chart-container { background: white; border-radius: 12px; padding: 15px; max-width: 600px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  </style>
</head>
<body>

  <div class="header">
    <h2>MÁY SẤY LẠNH INDUSTRIAL</h2>
    <div id="status" class="status-badge">Đang kết nối Firebase...</div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Nhiệt Độ</h3>
      <div id="temp" class="value">-- °C</div>
    </div>
    <div class="card">
      <h3>Độ Ẩm</h3>
      <div id="hum" class="value hum">-- %</div>
    </div>
  </div>

  <div class="chart-container">
    <canvas id="realtimeChart"></canvas>
  </div>

  <script>
    // 1. Cấu hình Firebase Database
    const firebaseConfig = {
      databaseURL: "https://freeze-drying-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Khởi tạo Biểu đồ Chart.js
    const ctx = document.getElementById('realtimeChart').getContext('2d');
    const maxDataPoints = 20; // Giới hạn hiển thị 20 điểm dữ liệu mới nhất

    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Nhiệt độ (°C)',
            data: [],
            borderColor: '#e53e3e',
            backgroundColor: 'rgba(229, 62, 62, 0.1)',
            borderWidth: 2,
            tension: 0.3,
            fill: true
          },
          {
            label: 'Độ ẩm (%)',
            data: [],
            borderColor: '#38a169',
            backgroundColor: 'rgba(56, 161, 105, 0.1)',
            borderWidth: 2,
            tension: 0.3,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'top' }
        },
        scales: {
          x: { display: true },
          y: { beginAtZero: false }
        }
      }
    });

    // 3. Biến theo dõi thời gian cập nhật dữ liệu gần nhất
    let lastUpdateTech = 0;

    // Hàm cập nhật hiển thị trạng thái Trực tuyến / Ngoại tuyến
    function setOnlineStatus(isOnline) {
      const statusEl = document.getElementById('status');
      if (isOnline) {
        statusEl.innerText = '● Trực tuyến (Real-time)';
        statusEl.style.backgroundColor = '#c6f6d5';
        statusEl.style.color = '#22543d';
      } else {
        statusEl.innerText = '○ Mất kết nối (Offline)';
        statusEl.style.backgroundColor = '#fed7d7';
        statusEl.style.color = '#742a2a';
      }
    }

    // 4. Lắng nghe dữ liệu thời gian thực từ Firebase Node /may_say
    db.ref('/may_say').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && data.nhiet_do !== undefined && data.do_am !== undefined) {
        const temp = parseFloat(data.nhiet_do);
        const hum = parseFloat(data.do_am);
        const now = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        // Cập nhật số liệu trên thẻ hiển thị
        document.getElementById('temp').innerText = temp.toFixed(1) + ' °C';
        document.getElementById('hum').innerText = hum.toFixed(1) + ' %';

        // Đánh dấu thời điểm nhận dữ liệu gần nhất
        lastUpdateTech = Date.now();
        setOnlineStatus(true);

        // Cập nhật dữ liệu vào Biểu đồ
        if (chart.data.labels.length >= maxDataPoints) {
          chart.data.labels.shift();
          chart.data.datasets[0].data.shift();
          chart.data.datasets[1].data.shift();
        }

        chart.data.labels.push(now);
        chart.data.datasets[0].data.push(temp);
        chart.data.datasets[1].data.push(hum);
        chart.update();
      }
    }, (error) => {
      const statusEl = document.getElementById('status');
      statusEl.innerText = 'Lỗi kết nối: ' + error.message;
      statusEl.style.backgroundColor = '#fed7d7';
      statusEl.style.color = '#742a2a';
    });

    // 5. Bộ đếm tự động kiểm tra xem ESP32 có ngắt kết nối không (Mỗi 2.5 giây)
    setInterval(() => {
      if (lastUpdateTech > 0 && (Date.now() - lastUpdateTech > 3000)) {
        setOnlineStatus(false);
      }
    }, 1500);
  </script>
</body>
</html>
